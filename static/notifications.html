<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/mobile.css?v=1.18.5"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><title>Notification History · Option Intelligence</title><link rel="stylesheet" href="/static/style.css?v=1.18.5"><style>main{max-width:1000px;margin:24px auto;padding:0 16px}.item{padding:14px;margin:10px 0;background:#142238;border:1px solid #2b3d55;border-radius:12px}.muted{color:#9aacc2;font-size:12px}</style></head><body><header class="topbar"><div class="brand">OPTION <span>INTELLIGENCE</span></div><a class="button secondary" href="/">Back to terminal</a></header><main><h1>Confirmed Signal Notifications</h1><p class="muted">History of confirmed BUY CE / BUY PE alerts stored for your account.</p><div id="history">Loading…</div></main><script>fetch('/api/notifications').then(r=>{if(!r.ok)throw Error('Please sign in again.');return r.json()}).then(d=>{const el=document.getElementById('history');el.innerHTML='';if(!d.rows.length){el.textContent='No confirmed notifications recorded yet.';return;}for(const x of d.rows){const a=document.createElement('article');a.className='item';const h=document.createElement('strong');h.textContent=x.title;const p=document.createElement('p');p.textContent=x.body;const t=document.createElement('div');t.className='muted';t.textContent=new Date(x.created_at).toLocaleString();a.append(h,p,t);el.append(a)}}).catch(e=>document.getElementById('history').textContent=e.message);</script><script src="/static/mobile.js?v=1.18.5"></script></body></html>
