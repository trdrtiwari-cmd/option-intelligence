<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Option Intelligence - connecting</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#dbe6f3;font:15px system-ui,Segoe UI,sans-serif}
  .box{max-width:460px;padding:28px;border:1px solid #2b3d55;border-radius:14px;background:#142238;text-align:center}
  h1{font-size:19px;margin:0 0 10px}p{color:#9aacc2;margin:8px 0}button{margin-top:14px;padding:9px 18px;border:0;border-radius:8px;background:#2f7cf6;color:#fff;font-weight:600;cursor:pointer}
  small{color:#6f8299}
</style></head>
<body><div class="box">
  <h1>Connecting to Option Intelligence…</h1>
  <p>The server could not be reached. It may be waking up (this can take up to a minute), or this PC may be offline.</p>
  <p id="next">Trying again in <b id="sec">15</b> s</p>
  <button id="retry">Try now</button>
  <p><small id="why"></small></p>
</div>
<script>
  const q = new URLSearchParams(location.search), url = q.get("url");
  document.getElementById("why").textContent = q.get("reason") ? "Reason: " + q.get("reason") : "";
  let s = 15;
  const go = () => { if (url) location.href = url; };
  document.getElementById("retry").onclick = go;
  setInterval(() => { s -= 1; document.getElementById("sec").textContent = Math.max(0, s); if (s <= 0) { s = 15; if (navigator.onLine) go(); } }, 1000);
</script>
</body></html>
