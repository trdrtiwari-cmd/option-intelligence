<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/mobile.css?v=1.20.31"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><title>Notification History · Option Intelligence</title><link rel="stylesheet" href="/static/style.css?v=1.20.31"><style>main{max-width:1000px;margin:24px auto;padding:0 16px}.item{padding:14px;margin:10px 0;background:#142238;border:1px solid #2b3d55;border-radius:12px}.muted{color:#9aacc2;font-size:12px}</style></head><body><header class="topbar"><div class="brand">OPTION <span>INTELLIGENCE</span></div><a class="button secondary" href="/">Back to terminal</a></header><main><h1>Alert monitor &amp; notifications</h1><section class="item" id="monitorBox"><strong>Monitor status</strong><div id="monitor" class="muted" style="margin-top:6px">Loading…</div><div style="margin-top:10px"><button id="mTest" class="secondary" type="button">Send test alert</button> <span id="mTestMsg" class="muted"></span></div></section><p class="muted">History of alerts (setup detected, confirmed BUY CE / BUY PE, system notices) stored for your account.</p><div id="history">Loading…</div></main><script>fetch('/api/notifications').then(r=>{if(!r.ok)throw Error('Please sign in again.');return r.json()}).then(d=>{const el=document.getElementById('history');el.innerHTML='';if(!d.rows.length){el.textContent='No confirmed notifications recorded yet.';return;}for(const x of d.rows){const a=document.createElement('article');a.className='item';const h=document.createElement('strong');h.textContent=x.title;const p=document.createElement('p');p.textContent=x.body;const t=document.createElement('div');t.className='muted';t.textContent=new Date(x.created_at).toLocaleString();a.append(h,p,t);el.append(a)}}).catch(e=>document.getElementById('history').textContent=e.message);</script><script>(function(){const box=document.getElementById('monitor');
function line(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;box.appendChild(d)}
const ago=x=>x==null?'—':x<90?x+'s ago':Math.round(x/60)+' min ago';
async function load(){try{const r=await fetch('/api/push/status');if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();box.innerHTML='';const m=s.monitor||{},d=s.devices||{};
line('Server: up '+Math.round(s.server_uptime_s/60)+' min · market '+(s.market_open?'open':'closed')+' · Upstox token '+(s.token_state||'unknown'));
line('Monitor: '+(m.running?'running':s.market_open?'NOT running':'idle (market closed)')+' · last check '+ago(m.last_check_ago_s)+(m.last_error?' · last error: '+m.last_error:''));
const w=m.watching||{};line('Watching: '+(w.symbols||[]).join(', ')+' · '+w.interval+'m · '+w.mode+' · score ≥ '+w.score_min+' · alerts for: '+(m.events||[]).join(', '));
Object.entries(m.symbols||{}).forEach(([k,v])=>line(k+': '+(v.action||'—')+' · score '+(v.score??'—')+' · reconfirm '+(v.reconfirm||'—')+' · '+new Date(v.at*1000).toLocaleTimeString()));
line('Phones registered for you: '+((d.web||0)+(d.native||0))+((d.kinds||[]).length?' ('+d.kinds.join(', ')+')':'')+' · push holds up to '+Math.round((s.ttl_s||0)/60)+' min for a sleeping phone');
if(s.last_alert)line('Last alert: '+s.last_alert.event+' '+s.last_alert.symbol+' '+(s.last_alert.side||'')+' at '+new Date(s.last_alert.at*1000).toLocaleTimeString());
if(s.gap)line('Monitor was offline '+s.gap.from+' → '+s.gap.to+' ('+s.gap.minutes+' min) - signals in that window were not watched.','var(--yellow)');
(s.problems||[]).forEach(p=>line('⚠ '+p,'var(--yellow)'));if(!(s.problems||[]).length)line('✓ No problems detected','var(--green)')}catch(e){box.textContent='Could not load status: '+e.message}}
document.getElementById('mTest').onclick=async()=>{const b=document.getElementById('mTest'),o=document.getElementById('mTestMsg');b.disabled=true;o.textContent='Sending…';try{const r=await fetch('/api/alerts/test',{method:'POST'});const d=await r.json();o.textContent=d.summary||d.message||d.detail||'Done'}catch(e){o.textContent='Failed: '+e.message}finally{b.disabled=false;load()}};
load();setInterval(load,15000)})();</script><script src="/static/mobile.js?v=1.20.31"></script></body></html>
