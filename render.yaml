services:
  - type: web
    name: option-intelligence-new
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: TRADINGVIEW_WEBHOOK_SECRET
        sync: false
