# Keeps a Render Free service awake so the background alert monitor keeps running when nobody has the app open.
# Optional: secret APP_URL overrides the address below. (v1.20.13: moved to the repo root - GitHub never ran it from the subfolder.)
# GitHub runs scheduled jobs on a best-effort basis (often a few minutes late); UptimeRobot / cron-job.org every 5 min is more regular.
name: keepalive
on:
  schedule:
    - cron: "*/5 3-11 * * 1-5"      # every 5 min, 08:30-17:30 IST on weekdays (UTC hours 3-11)
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://option-intelligence-vqtl.onrender.com' }}
        run: |
          # a sleeping Render Free service needs up to ~60 s to wake: retry instead of failing the run
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors --max-time 90 "${APP_URL%/}/health" && echo " awake"
