
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed Option Intelligence website URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apk:
    name: Build Option Intelligence APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Set application URL
        run: node set-url.mjs
        env:
          APP_URL: ${{ inputs.app_url }}

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase for native push
        shell: bash
        env:
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e

          python - <<'PY'
          import os
          import json
          import base64
          from pathlib import Path

          value = os.environ.get("FIREBASE_CONFIG", "").strip()

          if not value:
              raise SystemExit("ERROR: GOOGLE_SERVICES_JSON_BASE64 secret is empty.")

          # Accept raw JSON or Base64-encoded JSON.
          try:
              data = json.loads(value)
              print("Raw Firebase JSON detected.")
          except json.JSONDecodeError:
              try:
                  compact = "".join(value.split())
                  decoded = base64.b64decode(compact, validate=True).decode("utf-8")
                  data = json.loads(decoded)
                  print("Base64 Firebase JSON detected.")
              except Exception:
                  raise SystemExit(
                      "ERROR: Firebase secret is neither valid JSON nor valid Base64 JSON."
                  )

          clients = data.get("client", [])

          if not clients:
              raise SystemExit("ERROR: Firebase Android client is missing.")

          package = clients[0]["client_info"]["android_client_info"]["package_name"]

          print("Firebase Android package:", package)

          if package != "app.optionintelligence.terminal":
              raise SystemExit("ERROR: Firebase Android package name mismatch.")

          output = Path("android/app/google-services.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(data, indent=2), encoding="utf-8")

          print("Firebase configuration validated successfully.")
          PY

          # Configure Google Services Gradle plugin.
          if [ ! -f android/build.gradle ] || [ ! -f android/app/build.gradle ]; then
            echo "ERROR: Expected Android Gradle files were not generated."
            exit 1
          fi

          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          fi

          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

          echo "Firebase Gradle configuration completed."

      - name: Generate Android assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b1220' --splashBackgroundColor '#0b1220'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully."
        working-directory: mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: option-intelligence-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
