
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed Option Intelligence website URL"
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Set application URL
        run: node set-url.mjs
        env:
          APP_URL: ${{ inputs.app_url }}

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase for native push
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

            if [ ! -s android/app/google-services.json ]; then
              echo "ERROR: Firebase configuration is empty."
              exit 1
            fi

            python - <<'PY'
          import json
          from pathlib import Path

          p = Path("android/app/google-services.json")
          data = json.loads(p.read_text())
          package = data["client"][0]["client_info"]["android_client_info"]["package_name"]

          print("Firebase Android package:", package)

          if package != "app.optionintelligence.terminal":
              raise SystemExit("ERROR: Firebase package name mismatch.")
          PY

            sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

            echo "Firebase configuration completed."
          else
            echo "WARNING: Firebase secret not configured. Native push will not be enabled."
          fi

      - name: Generate Android assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0b1220' --splashBackgroundColor '#0b1220'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: option-intelligence-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
