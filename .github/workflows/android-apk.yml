# Builds an installable Android APK of Option Intelligence - no Android Studio needed.
# GitHub -> Actions -> "Build Android APK" -> Run workflow -> enter your site address (https://....onrender.com).
# When it finishes, download the "option-intelligence-apk" artifact, unzip it, send app-debug.apk to your phone and open it.
name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed site, e.g. https://option-intelligence.onrender.com"
        required: true
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node set-url.mjs
        env: { APP_URL: "${{ inputs.app_url }}" }
      - run: npx cap add android
      - name: Configure Firebase for native push (optional)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0b1220' --splashBackgroundColor '#0b1220'
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: option-intelligence-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
