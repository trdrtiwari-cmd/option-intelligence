# Builds an installable Android APK of Option Intelligence on GitHub (no Android Studio needed) and publishes it as the
# "Android APK (latest)" release: https://github.com/trdrtiwari-cmd/option-intelligence/releases/tag/apk-latest
# Runs by itself when the mobile shell changes, or: Actions -> "Build Android APK" -> Run workflow (optionally another site URL).
# The app loads the live site, so normal website updates on Render do NOT need a new APK.
name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed site address"
        required: false
        default: "https://option-intelligence-vqtl.onrender.com"
  push:
    branches: [main]
    paths:
      - "option-intelligence-main/mobile/**"
      - ".github/workflows/android-apk.yml"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url || 'https://option-intelligence-vqtl.onrender.com' }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    defaults:
      run:
        working-directory: option-intelligence-main/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node set-url.mjs
      - run: npx cap add android
      - name: Configure Firebase for native push (only when the secret exists)
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            echo "Firebase configured"
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret - building without native push (web/Telegram alerts still work)"
          fi
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0b1220' --splashBackgroundColor '#0b1220'
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: option-intelligence-main/mobile/android
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OptionIntelligence.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: option-intelligence-apk
          path: OptionIntelligence.apk
      - name: Publish as the "apk-latest" release (stable download link)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest OptionIntelligence.apk --target "$GITHUB_SHA" --title "Android APK (latest)" \
            --notes "Option Intelligence Android app - loads $APP_URL. Download OptionIntelligence.apk on your phone, open it and allow installing from this source once. Debug-signed for personal use (not Play Store). Built from ${GITHUB_SHA::7}."
